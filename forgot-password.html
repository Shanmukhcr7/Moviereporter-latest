<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Movie Reporter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <main class="container auth-form-container">
    <section class="section-block auth-section">
      <h2>Reset Your Password</h2>
      <form id="forgot-password-form" class="auth-form">
        <div class="form-group">
          <label for="reset-email">Email Address:</label>
          <input type="email" id="reset-email" placeholder="Enter your email" required />
        </div>
        <button type="submit" class="btn primary">Send Reset Email</button>
        <p class="auth-switch">
          <a href="login.html" class="btn secondary" style="margin-top: 10px;">← Back to Login</a>
        </p>
      </form>
    </section>
  </main>

  <div id="toast-container"></div>
  
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
